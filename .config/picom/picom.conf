backend = "glx";

corner-radius = 7.0;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'dialog'",
  "class_g = 'dmenu'"
];

opacity-rule = [
	"100:class_g = 'org.wezfurlong.wezterm' && focused",
	"95:class_g = 'org.wezfurlong.wezterm' && !focused", 
	"100:class_g = 'com.mitchellh.ghostty' && focused",
	"95:class_g = 'com.mitchellh.ghostty' && !focused", 
	"100:class_g = 'Alacritty' && focused",
	"95:class_g = 'Alacritty' && !focused", 
];

