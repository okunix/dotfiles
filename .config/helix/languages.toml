[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[[language]]
name = "python"
language-servers = ["pyright"]
file-types = ["py"]
shebangs = ["python", "python3"]
scope = "source.python"

[[language]]
name = "bash"
shebangs = ["sh", "bash"]

[[language]]
name = "ansible"
scope = "source.yaml"
language-servers = ["ansible-language-server", "yaml-language-server"]
file-types=[
  {glob = "ansible/**/*.{yaml,yaml}"},
]
